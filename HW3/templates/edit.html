{% extends "base.html" %}

{% block content %}
    <h2>할 일 수정</h2>
    <form method = "POST">
        <input type = "text" name = "text" value = "{{ todo.text }}" required>
        <input type = "text" name = "note" value = "{{ todo.note or '' }}">
        <button type = "submit">저장</button>
    </form>
    <a href = "{{ url_for('index') }}">목록으로</a>
{% endblock %}
